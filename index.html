<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026학년도 2학기 1차 정기시험 시정표</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/webfontworld/nanumsquareneo/nanumsquareneo.css');

        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #f1f5f9 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --brand-primary: #3b82f6;
            --brand-accent: #2563eb;
            --active-color: #10b981;
            --active-bg: #ecfdf5;
            --prep-color: #f59e0b;
            --prep-bg: #fffbeb;
            --border-color: #e2e8f0;
            --glass-border: rgba(255, 255, 255, 0.6);
            --card-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
            --font-family: 'NanumSquareNeo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem 2.5rem;
            gap: 1.5rem;
        }

        /* 헤더 디자인: 완벽한 중앙 정렬 및 밸런스 */
        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            background: var(--card-bg);
            padding: 1.25rem 2.5rem;
            border-radius: 1.25rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: #f1f5f9;
            padding: 0.35rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-sub);
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--active-color);
            box-shadow: 0 0 8px var(--active-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        .header-title {
            grid-column: 2;
            font-size: 1.75rem;
            font-weight: 900;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            text-align: center;
            white-space: nowrap;
        }

        .controls {
            grid-column: 3;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-group label {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-sub);
        }

        select {
            background-color: #f8fafc;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.55rem 1rem;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 0.75rem;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, select:hover {
            border-color: var(--brand-primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* 메인 레이아웃: 1:1 대칭 그리드 */
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.75rem;
            flex: 1;
            align-items: stretch;
        }

        /* 좌측: 시정표 컨테이너 */
        .schedule-container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            height: 100%;
        }

        .period-tabs {
            display: flex;
            gap: 0.5rem;
            background-color: #e2e8f0;
            padding: 0.35rem;
            border-radius: 0.9rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.7rem;
            font-size: 0.95rem;
            font-weight: 800;
            border: none;
            background: transparent;
            color: var(--text-sub);
            border-radius: 0.65rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn.active {
            background-color: #ffffff;
            color: var(--brand-accent);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        .day-section {
            background-color: var(--card-bg);
            border-radius: 1.25rem;
            padding: 1.75rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .day-title-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 0.85rem;
            border-bottom: 2px solid #f1f5f9;
        }

        .day-title {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--text-main);
        }

        .day-subtitle {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--brand-accent);
        }

        .table-wrap {
            flex: 1;
            overflow-x: auto;
        }

        .period-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 0.5rem;
        }

        .period-table th {
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: 800;
            padding: 0.6rem 1rem;
            text-align: left;
        }

        .period-table tbody tr {
            background: #f8fafc;
            border-radius: 0.75rem;
            transition: all 0.2s ease;
        }

        .period-table td {
            padding: 1rem 1rem;
            font-size: 1.05rem;
            font-weight: 700;
            border-top: 1px solid transparent;
            border-bottom: 1px solid transparent;
        }

        .period-table td:first-child {
            border-top-left-radius: 0.75rem;
            border-bottom-left-radius: 0.75rem;
            font-weight: 900;
            color: var(--brand-accent);
        }

        .period-table td:last-child {
            border-top-right-radius: 0.75rem;
            border-bottom-right-radius: 0.75rem;
        }

        .status-active td {
            background-color: var(--active-bg) !important;
            color: #065f46 !important;
            border-color: #a7f3d0 !important;
        }

        .status-prep td {
            background-color: var(--prep-bg) !important;
            color: #92400e !important;
            border-color: #fde68a !important;
        }

        /* 우측: 프리미엄 시계 패널 */
        .clock-panel {
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
            border-radius: 1.25rem;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .clock-panel::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }

        .clock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
        }

        .clock-header-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .current-status-tag {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .clock-display-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 0;
            z-index: 1;
        }

        .big-clock {
            font-size: clamp(3.5rem, 6.5vw, 6rem);
            font-weight: 900;
            color: #f8fafc;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.02em;
            text-shadow: 0 0 40px rgba(59, 130, 246, 0.35);
            line-height: 1;
            margin-bottom: 1.25rem;
        }

        .clock-date-display {
            font-size: 1.25rem;
            font-weight: 700;
            color: #94a3b8;
        }

        .clock-footer {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.9rem;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1;
        }

        .status-info-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #64748b;
        }

        .status-info-text {
            font-size: 1rem;
            font-weight: 800;
            color: #f8fafc;
        }

        @media (max-width: 1024px) {
            header {
                grid-template-columns: 1fr;
                gap: 1rem;
                text-align: center;
            }
            .header-left, .controls {
                justify-content: center;
            }
            .header-title {
                grid-column: 1;
            }
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="badge-live">
                <span class="badge-dot"></span>
                실시간 동기화
            </div>
        </div>
        <div class="header-title">2026학년도 2학기 1차 정기시험</div>
        <div class="controls">
            <div class="control-group">
                <label for="daySelect">일정</label>
                <select id="daySelect" onchange="renderSchedule()">
                    <option value="2026-10-06">1일차 (10. 6. 화)</option>
                    <option value="2026-10-07">2일차 (10. 7. 수)</option>
                    <option value="2026-10-08">3일차 (10. 8. 목)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="gradeSelect">학년</label>
                <select id="gradeSelect" onchange="renderSchedule()">
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3" selected>3학년</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        <!-- 좌측: 시정표 영역 -->
        <div class="schedule-container">
            <div class="period-tabs">
                <button class="tab-btn active" onclick="setPeriodFilter('all', this)">전체</button>
                <button class="tab-btn" onclick="setPeriodFilter('1교시', this)">1교시</button>
                <button class="tab-btn" onclick="setPeriodFilter('2교시', this)">2교시</button>
                <button class="tab-btn" onclick="setPeriodFilter('3교시', this)">3교시</button>
            </div>

            <div id="scheduleContainer" style="flex: 1; display: flex; flex-direction: column;"></div>
        </div>

        <!-- 우측: 모던 다크 글래스 시계 패널 -->
        <div class="clock-panel">
            <div class="clock-header">
                <span class="clock-header-title">Standard Clock</span>
                <span class="current-status-tag" id="statusTag">시험 대기</span>
            </div>

            <div class="clock-display-wrap">
                <div class="big-clock" id="bigClock">00:00:00</div>
                <div class="clock-date-display" id="clockDate">2026년 10월 06일 화요일</div>
            </div>

            <div class="clock-footer">
                <span class="status-info-label">진행 현황</span>
                <span class="status-info-text" id="statusDetail">일정을 불러오는 중입니다</span>
            </div>
        </div>
    </main>

    <script>
        const examData = [
            {
                date: "2026-10-06",
                dayName: "10. 6.(화)",
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "교과융합수업", 2: "한문(11) / 중국어(13)", 3: "수학(04)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "교과융합수업", 2: "한문(11) / 중국어(13)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "-", 2: "-", 3: "기술·가정(06)" }
                    }
                ]
            },
            {
                date: "2026-10-07",
                dayName: "10. 7.(수)",
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "AI 중점학교", 2: "자율 / 사회(03)", 3: "국어(01)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "운영수업", 2: "사회(03)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "-", 2: "-", 3: "역사(16)" }
                    }
                ]
            },
            {
                date: "2026-10-08",
                dayName: "10. 8.(목)",
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "평화공존 교육", 2: "자율 / 도덕(02)", 3: "영어(10)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "자유학기 주제선택", 2: "도덕(02)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "주제선택 (3,4교시)", 2: "-", 3: "과학(05)" }
                    }
                ]
            }
        ];

        let selectedPeriodFilter = 'all';

        function initDateSelect() {
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const daySelect = document.getElementById('daySelect');
            if (examData.some(d => d.date === todayStr)) {
                daySelect.value = todayStr;
            }
        }

        function setPeriodFilter(period, btn) {
            selectedPeriodFilter = period;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSchedule();
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('bigClock').innerText = timeStr;

            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const dayName = days[now.getDay()];
            document.getElementById('clockDate').innerText = `${year}년 ${month}월 ${date}일 (${dayName})`;

            checkActivePeriod(now);
        }

        function renderSchedule() {
            const grade = document.getElementById('gradeSelect').value;
            const selectedDate = document.getElementById('daySelect').value;
            const container = document.getElementById('scheduleContainer');
            const currentDay = examData.find(d => d.date === selectedDate) || examData[0];

            const filteredPeriods = currentDay.periods.filter(p => {
                if (selectedPeriodFilter === 'all') return true;
                return p.period === selectedPeriodFilter;
            });

            let html = `
                <div class="day-section">
                    <div class="day-title-wrap">
                        <div class="day-title">${currentDay.dayName} 시정표</div>
                        <div class="day-subtitle">${grade}학년 기준</div>
                    </div>
                    <div class="table-wrap">
                        <table class="period-table">
                            <thead>
                                <tr>
                                    <th>교시</th>
                                    <th>준비시간</th>
                                    <th>시험시간</th>
                                    <th>과목명</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            filteredPeriods.forEach(p => {
                const subject = p.subjects[grade] || '-';
                html += `
                    <tr id="row-${currentDay.date}-${p.period}">
                        <td>${p.period}</td>
                        <td>${p.prep}</td>
                        <td>${p.exam}</td>
                        <td>${subject}</td>
                    </tr>
                `;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            checkActivePeriod(new Date());
        }

        function checkActivePeriod(now) {
            const selectedDate = document.getElementById('daySelect').value;
            const currentTimeStr = now.toTimeString().substring(0, 5);
            const currentDay = examData.find(d => d.date === selectedDate);
            const grade = document.getElementById('gradeSelect').value;

            const statusTag = document.getElementById('statusTag');
            const statusDetail = document.getElementById('statusDetail');

            document.querySelectorAll('.period-table tbody tr').forEach(r => r.classList.remove('status-active', 'status-prep'));

            let foundActive = false;

            if (currentDay) {
                for (let p of currentDay.periods) {
                    const subject = p.subjects[grade] || '해당 없음';
                    if (currentTimeStr >= p.startTime && currentTimeStr < p.prepEndTime) {
                        highlightRow(currentDay.date, p.period, "status-prep");
                        statusTag.innerText = "준비 시간";
                        statusTag.style.color = "#f59e0b";
                        statusDetail.innerText = `${p.period} 준비 중 (${subject})`;
                        foundActive = true;
                        break;
                    } 
                    else if (currentTimeStr >= p.prepEndTime && currentTimeStr < p.endTime) {
                        highlightRow(currentDay.date, p.period, "status-active");
                        statusTag.innerText = "시험 진행 중";
                        statusTag.style.color = "#10b981";
                        statusDetail.innerText = `${p.period} 본시험 (${subject})`;
                        foundActive = true;
                        break;
                    }
                }
            }

            if (!foundActive) {
                statusTag.innerText = "대기 / 종료";
                statusTag.style.color = "#94a3b8";
                statusDetail.innerText = "현재 진행 중인 시험 일정이 없습니다.";
            }
        }

        function highlightRow(date, period, className) {
            const row = document.getElementById(`row-${date}-${period}`);
            if (row) row.classList.add(className);
        }

        function startPreciseClock() {
            updateClock();
            const now = new Date();
            const delay = 1000 - now.getMilliseconds();
            setTimeout(() => {
                updateClock();
                setInterval(updateClock, 1000);
            }, delay);
        }

        initDateSelect();
        renderSchedule();
        startPreciseClock();
    </script>
</body>
</html>
