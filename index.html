<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험 시정표 위젯</title>
    <style>
        /* 나눔스퀘어 네오 웹폰트 불러오기 */
        @import url('https://cdn.jsdelivr.net/gh/webfontworld/nanumsquareneo/nanumsquareneo.css');

        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;       /* 선명한 딥 네이비 (시안성 극대화) */
            --text-secondary: #334155;     /* 또렷한 슬레이트 블루 */
            --accent-color: #1d4ed8;       /* 시선 집중용 메인 블루 */
            --active-color: #15803d;       /* 진행 중: 선명한 에메랄드 그린 */
            --active-bg: #e6f4ea;
            --prep-color: #c2410c;         /* 준비 중: 가시성 높은 딥 오렌지 */
            --prep-bg: #fff7ed;
            --border-color: #cbd5e1;
            --shadow: 0 8px 16px -2px rgba(15, 23, 42, 0.08), 0 4px 6px -2px rgba(15, 23, 42, 0.04);
            --font-main: 'NanumSquareNeo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        /* 상단 헤더 및 컨트롤러 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 1.2rem 2rem;
            border-radius: 1.2rem;
            margin-bottom: 1.5rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .header-title {
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: -0.5px;
        }

        .controls {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .control-group label {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        select {
            background-color: #f8fafc;
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 0.6rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        /* 레이아웃 메인 */
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            flex: 1;
        }

        /* 왼쪽: 시간표 및 탭 영역 */
        .schedule-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* 교시 선택 탭 */
        .period-tabs {
            display: flex;
            gap: 0.6rem;
            background-color: var(--card-bg);
            padding: 0.6rem;
            border-radius: 1rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .tab-btn {
            flex: 1;
            padding: 0.9rem 1rem;
            font-size: 1.2rem;
            font-weight: 800;
            border: none;
            background-color: transparent;
            color: var(--text-secondary);
            border-radius: 0.6rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: #f1f5f9;
            color: var(--accent-color);
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(29, 78, 216, 0.3);
        }

        .day-section {
            background-color: var(--card-bg);
            border-radius: 1.2rem;
            padding: 1.8rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow);
            flex: 1;
        }

        .day-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 1.2rem;
            color: var(--accent-color);
            border-bottom: 3px solid var(--bg-color);
            padding-bottom: 0.8rem;
        }

        .period-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .period-table th, .period-table td {
            padding: 1.2rem 1.2rem;
            text-align: left;
        }

        .period-table th {
            color: var(--text-secondary);
            font-size: 1.15rem;
            font-weight: 800;
            background-color: #f8fafc;
            border-bottom: 2px solid var(--border-color);
        }

        .period-table td {
            font-size: 1.3rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
        }

        /* 현재 진행 중인 교시 고대비 하이라이트 */
        .status-active {
            background-color: var(--active-bg) !important;
            border-left: 8px solid var(--active-color) !important;
            color: var(--active-color) !important;
        }

        .status-prep {
            background-color: var(--prep-bg) !important;
            border-left: 8px solid var(--prep-color) !important;
            color: var(--prep-color) !important;
        }

        /* 오른쪽: 대형 시계 위젯 패널 */
        .clock-panel {
            background-color: var(--card-bg);
            border-radius: 1.2rem;
            padding: 2.5rem 1.5rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* '현재 시간' 글자 크기를 기존 2.4rem에서 3배(7.2rem) 확대 */
        .clock-label {
            font-size: 7.2rem;
            font-weight: 900;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        /* 2배 확대된 현재 시간 디스플레이 */
        .big-clock {
            font-size: 10rem;
            font-weight: 900;
            color: var(--text-primary);
            font-family: 'NanumSquareNeo', monospace;
            letter-spacing: -2px;
            line-height: 1.0;
            background: #f8fafc;
            padding: 2.5rem 1rem;
            border-radius: 1.2rem;
            border: 3px solid var(--border-color);
            width: 100%;
            box-shadow: inset 0 2px 8px 0 rgba(0,0,0,0.06);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">2026학년도 2학기 1차 정기시험</div>
        <div class="controls">
            <div class="control-group">
                <label for="daySelect">시험일:</label>
                <select id="daySelect" onchange="renderSchedule()">
                    <option value="2026-10-06">1일차 (10. 6. 화)</option>
                    <option value="2026-10-07">2일차 (10. 7. 수)</option>
                    <option value="2026-10-08">3일차 (10. 8. 목)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="gradeSelect">학년:</label>
                <select id="gradeSelect" onchange="renderSchedule()">
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3" selected>3학년</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        <!-- 왼쪽: 시험 일정 테이블 및 교시 필터 -->
        <div class="schedule-container">
            <!-- 교시 선택 탭 -->
            <div class="period-tabs">
                <button class="tab-btn active" onclick="setPeriodFilter('all', this)">전체 교시</button>
                <button class="tab-btn" onclick="setPeriodFilter('1교시', this)">1교시</button>
                <button class="tab-btn" onclick="setPeriodFilter('2교시', this)">2교시</button>
                <button class="tab-btn" onclick="setPeriodFilter('3교시', this)">3교시</button>
            </div>

            <!-- 특정 일자 시험 일정 카드 -->
            <div id="scheduleContainer">
                <!-- 자바스크립트로 자동 생성 -->
            </div>
        </div>

        <!-- 우측: 대형 시계 위젯 -->
        <div class="clock-panel">
            <div class="clock-label">현재 시간</div>
            <div class="big-clock" id="bigClock">00:00:00</div>
        </div>
    </main>

    <script>
        // PDF 데이터 기반 시간표 설정
        const examData = [
            {
                date: "2026-10-06",
                dayName: "10. 6.(화)",
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "교과융합수업", 2: "한문(11) / 중국어(13)", 3: "수학(04)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "교과융합수업", 2: "한문(11) / 중국어(13)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "-", 2: "-", 3: "기술·가정(06)" }
                    }
                ]
            },
            {
                date: "2026-10-07",
                dayName: "10. 7.(수)",
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "AI 중점학교", 2: "자율 / 사회(03)", 3: "국어(01)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "운영수업", 2: "사회(03)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "-", 2: "-", 3: "역사(16)" }
                    }
                ]
            },
            {
                date: "2026-10-08",
                dayName: "10. 8.(목)",
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "평화공존 교육", 2: "자율 / 도덕(02)", 3: "영어(10)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "자유학기 주제선택", 2: "도덕(02)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "주제선택 (3,4교시)", 2: "-", 3: "과학(05)" }
                    }
                ]
            }
        ];

        let selectedPeriodFilter = 'all';

        function initDateSelect() {
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const daySelect = document.getElementById('daySelect');
            
            if (examData.some(d => d.date === todayStr)) {
                daySelect.value = todayStr;
            }
        }

        function setPeriodFilter(period, btn) {
            selectedPeriodFilter = period;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSchedule();
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('bigClock').innerText = timeStr;
            checkActivePeriod(now);
        }

        function renderSchedule() {
            const grade = document.getElementById('gradeSelect').value;
            const selectedDate = document.getElementById('daySelect').value;
            const container = document.getElementById('scheduleContainer');
            
            const currentDay = examData.find(d => d.date === selectedDate) || examData[0];

            const filteredPeriods = currentDay.periods.filter(p => {
                if (selectedPeriodFilter === 'all') return true;
                return p.period === selectedPeriodFilter;
            });

            let html = `
                <div class="day-section">
                    <div class="day-title">${currentDay.dayName} 시험 일정</div>
                    <table class="period-table">
                        <thead>
                            <tr>
                                <th>교시</th>
                                <th>준비시간</th>
                                <th>시험시간</th>
                                <th>과목</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            filteredPeriods.forEach(p => {
                const subject = p.subjects[grade] || '-';
                html += `
                    <tr id="row-${currentDay.date}-${p.period}">
                        <td><strong>${p.period}</strong></td>
                        <td>${p.prep}</td>
                        <td>${p.exam}</td>
                        <td><strong>${subject}</strong></td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;
            
            container.innerHTML = html;
            checkActivePeriod(new Date());
        }

        function checkActivePeriod(now) {
            const selectedDate = document.getElementById('daySelect').value;
            const currentTimeStr = now.toTimeString().substring(0, 5);

            const currentDay = examData.find(d => d.date === selectedDate);

            document.querySelectorAll('.period-table tr').forEach(r => r.classList.remove('status-active', 'status-prep'));

            if (currentDay) {
                for (let p of currentDay.periods) {
                    if (currentTimeStr >= p.startTime && currentTimeStr < p.prepEndTime) {
                        highlightRow(currentDay.date, p.period, "status-prep");
                        break;
                    } 
                    else if (currentTimeStr >= p.prepEndTime && currentTimeStr < p.endTime) {
                        highlightRow(currentDay.date, p.period, "status-active");
                        break;
                    }
                }
            }
        }

        function highlightRow(date, period, className) {
            const row = document.getElementById(`row-${date}-${period}`);
            if (row) row.classList.add(className);
        }

       // 밀리초 보정 시계 시작 함수
        function startPreciseClock() {
            updateClock();
            const now = new Date();
            // 다음 1초 정각(000ms)에 맞춰 타이머 동작 시작
            const delay = 1000 - now.getMilliseconds();
            setTimeout(() => {
                updateClock();
                setInterval(updateClock, 1000);
            }, delay);
        }

        // 초기화
        initDateSelect();
        renderSchedule();
        startPreciseClock(); // 보정된 시계 실행
    </script>
</body>
</html>
