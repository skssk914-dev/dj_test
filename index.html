<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026학년도 2학기 1차 정기시험 시정표</title>
    <style>
        :root {
            --bg-color: #e2e8f0;            /* 전체 배경: 선명한 대비를 주는 라이트 슬레이트 */
            --card-bg: #ffffff;             /* 패널 배경: 또렷한 화이트 */
            --text-main: #0f172a;           /* 주 텍스트: 선명한 딥 다크 */
            --text-sub: #334155;            /* 보조 텍스트: 또렷한 슬레이트 블루 */
            --brand-primary: #1d4ed8;       /* 메인 블루 */
            --brand-accent: #2563eb;        /* 강조 블루 */
            --active-color: #15803d;        /* 진행 중: 선명한 그린 */
            --active-bg: #dcfce7;
            --prep-color: #b45309;          /* 준비 중: 선명한 오렌지 */
            --prep-bg: #fef3c7;
            --border-color: #94a3b8;        /* 선명한 외곽선 테두리 */
            --card-shadow: 0 12px 24px -4px rgba(15, 23, 42, 0.12), 0 6px 12px -4px rgba(15, 23, 42, 0.08);
            --font-family: 'Malgun Gothic', '맑은 고딕', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 2rem;
            gap: 1.2rem;
        }

        /* 헤더 디자인 */
        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            background: var(--card-bg);
            padding: 1.1rem 2.2rem;
            border-radius: 1.2rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-sub);
        }

        .badge-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--active-color);
            box-shadow: 0 0 8px var(--active-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        .header-title {
            grid-column: 2;
            font-size: 2rem;
            font-weight: bold;
            color: var(--brand-primary);
            letter-spacing: -0.5px;
            text-align: center;
            white-space: nowrap;
        }

        .controls {
            grid-column: 3;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .control-group label {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--text-sub);
        }

        select {
            background-color: #ffffff;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 0.5rem 1.1rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 0.75rem;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, select:hover {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.2);
        }

        /* 메인 1:1 대칭 레이아웃 */
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            flex: 1;
            align-items: stretch;
        }

        /* 좌측: 시정표 영역 */
        .schedule-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 100%;
        }

        .period-tabs {
            display: flex;
            gap: 0.6rem;
            background-color: #cbd5e1;
            padding: 0.4rem;
            border-radius: 1rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.8rem;
            font-size: 1.15rem;
            font-weight: bold;
            border: none;
            background: transparent;
            color: var(--text-sub);
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #ffffff;
            color: var(--brand-primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .day-section {
            background-color: var(--card-bg);
            border-radius: 1.2rem;
            padding: 2rem 2.2rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--card-shadow);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .day-title-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 3px solid #f1f5f9;
        }

        .day-title {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .day-subtitle {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--brand-accent);
        }

        .table-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .period-table {
            width: 100%;
            height: 100%;
            border-collapse: separate;
            border-spacing: 0 0.8rem;
        }

        .period-table th {
            color: var(--text-sub);
            font-size: 1.35rem;
            font-weight: bold;
            padding: 0.6rem 0.8rem;
            text-align: center;
        }

        .period-table tbody tr {
            background: #f8fafc;
            border-radius: 0.9rem;
            transition: all 0.2s ease;
        }

        .period-table td {
            padding: 1.3rem 0.8rem;
            font-size: 1.55rem;
            font-weight: bold;
            text-align: center;
            border-top: 2px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
        }

        .period-table td:first-child {
            border-left: 2px solid var(--border-color);
            border-top-left-radius: 0.9rem;
            border-bottom-left-radius: 0.9rem;
            color: var(--brand-primary);
        }

        .period-table td:last-child {
            border-right: 2px solid var(--border-color);
            border-top-right-radius: 0.9rem;
            border-bottom-right-radius: 0.9rem;
            color: var(--text-main);
        }

        .status-active td {
            background-color: var(--active-bg) !important;
            color: var(--active-color) !important;
            border-color: #86efac !important;
        }

        .status-prep td {
            background-color: var(--prep-bg) !important;
            color: var(--prep-color) !important;
            border-color: #fde68a !important;
        }

        /* 우측: 선명하고 정돈된 대형 시계 패널 */
        .clock-panel {
            background-color: var(--card-bg);
            border-radius: 1.2rem;
            padding: 2.2rem 2.2rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .clock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .clock-header-title {
            font-size: 1.45rem;
            font-weight: bold;
            color: var(--text-sub);
            letter-spacing: -0.5px;
        }

        .current-status-tag {
            background: #ffffff;
            border: 2px solid #93c5fd;
            padding: 0.4rem 1.2rem;
            border-radius: 9999px;
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--brand-accent);
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.08);
        }

        .clock-display-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1rem 0;
        }

        /* 맑은 고딕 기반 대형 시계 */
        .big-clock {
            font-size: clamp(5.5rem, 8vw, 9.5rem);
            font-weight: bold;
            color: #0f172a;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 1.2rem;
            background: #f8fafc;
            padding: 1.8rem 1.2rem;
            border-radius: 1.2rem;
            width: 100%;
            border: 2px solid var(--border-color);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .clock-date-display {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--text-sub);
        }

        .clock-footer {
            background: #f8fafc;
            border: 2px solid var(--border-color);
            border-radius: 0.9rem;
            padding: 1.1rem 1.8rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-info-label {
            font-size: 1.15rem;
            font-weight: bold;
            color: #64748b;
        }

        .status-info-text {
            font-size: 1.35rem;
            font-weight: bold;
            color: var(--brand-primary);
        }

        @media (max-width: 1024px) {
            header {
                grid-template-columns: 1fr;
                gap: 1rem;
                text-align: center;
            }
            .header-left, .controls {
                justify-content: center;
            }
            .header-title {
                grid-column: 1;
            }
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="badge-live">
                <span class="badge-dot"></span>
                실시간 동기화
            </div>
        </div>
        <div class="header-title">2026학년도 2학기 1차 정기시험</div>
        <div class="controls">
            <div class="control-group">
                <label for="daySelect">일정</label>
                <select id="daySelect" onchange="renderSchedule()">
                    <option value="2026-10-06">1일차 (10. 6. 화)</option>
                    <option value="2026-10-07">2일차 (10. 7. 수)</option>
                    <option value="2026-10-08">3일차 (10. 8. 목)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="gradeSelect">학년</label>
                <select id="gradeSelect" onchange="renderSchedule()">
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3" selected>3학년</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        <!-- 좌측: 시정표 영역 -->
        <div class="schedule-container">
            <div class="period-tabs">
                <button class="tab-btn active" onclick="setPeriodFilter('all', this)">전체 교시</button>
                <button class="tab-btn" onclick="setPeriodFilter('1교시', this)">1교시</button>
                <button class="tab-btn" onclick="setPeriodFilter('2교시', this)">2교시</button>
                <button class="tab-btn" onclick="setPeriodFilter('3교시', this)">3교시</button>
            </div>

            <div id="scheduleContainer" style="flex: 1; display: flex; flex-direction: column;"></div>
        </div>

        <!-- 우측: 선명하고 단정한 대형 시계 패널 -->
        <div class="clock-panel">
            <div class="clock-header">
                <span class="clock-header-title">현재 표준 시각</span>
                <span class="current-status-tag" id="statusTag">시험 대기</span>
            </div>

            <div class="clock-display-wrap">
                <div class="big-clock" id="bigClock">00:00:00</div>
                <div class="clock-date-display" id="clockDate">2026년 10월 06일 (화)</div>
            </div>

            <div class="clock-footer">
                <span class="status-info-label">현재 상태</span>
                <span class="status-info-text" id="statusDetail">일정을 불러오는 중입니다</span>
            </div>
        </div>
    </main>

    <script>
        const examData = [
            {
                date: "2026-10-06",
                dayName: "10. 6.(화)",
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "교과융합수업", 2: "한문(11) / 중국어(13)", 3: "수학(04)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "교과융합수업", 2: "한문(11) / 중국어(13)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "-", 2: "-", 3: "기술·가정(06)" }
                    }
                ]
            },
            {
                date: "2026-10-07",
                dayName: "10. 7.(수)",
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "AI 중점학교", 2: "자율 / 사회(03)", 3: "국어(01)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "운영수업", 2: "사회(03)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "-", 2: "-", 3: "역사(16)" }
                    }
                ]
            },
            {
                date: "2026-10-08",
                dayName: "10. 8.(목)",
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "평화공존 교육", 2: "자율 / 도덕(02)", 3: "영어(10)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "자유학기 주제선택", 2: "도덕(02)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "주제선택 (3,4교시)", 2: "-", 3: "과학(05)" }
                    }
                ]
            }
        ];

        let selectedPeriodFilter = 'all';

        function initDateSelect() {
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const daySelect = document.getElementById('daySelect');
            if (examData.some(d => d.date === todayStr)) {
                daySelect.value = todayStr;
            }
        }

        function setPeriodFilter(period, btn) {
            selectedPeriodFilter = period;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSchedule();
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('bigClock').innerText = timeStr;

            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const dayName = days[now.getDay()];
            document.getElementById('clockDate').innerText = `${year}년 ${month}월 ${date}일 (${dayName})`;

            checkActivePeriod(now);
        }

        function renderSchedule() {
            const grade = document.getElementById('gradeSelect').value;
            const selectedDate = document.getElementById('daySelect').value;
            const container = document.getElementById('scheduleContainer');
            const currentDay = examData.find(d => d.date === selectedDate) || examData[0];

            const filteredPeriods = currentDay.periods.filter(p => {
                if (selectedPeriodFilter === 'all') return true;
                return p.period === selectedPeriodFilter;
            });

            let html = `
                <div class="day-section">
                    <div class="day-title-wrap">
                        <div class="day-title">${currentDay.dayName} 시정표</div>
                        <div class="day-subtitle">${grade}학년 기준</div>
                    </div>
                    <div class="table-wrap">
                        <table class="period-table">
                            <thead>
                                <tr>
                                    <th style="width: 20%;">교시</th>
                                    <th style="width: 27%;">준비시간</th>
                                    <th style="width: 27%;">시험시간</th>
                                    <th style="width: 26%;">과목명</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            filteredPeriods.forEach(p => {
                const subject = p.subjects[grade] || '-';
                html += `
                    <tr id="row-${currentDay.date}-${p.period}">
                        <td>${p.period}</td>
                        <td>${p.prep}</td>
                        <td>${p.exam}</td>
                        <td>${subject}</td>
                    </tr>
                `;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            checkActivePeriod(new Date());
        }

        function checkActivePeriod(now) {
            const selectedDate = document.getElementById('daySelect').value;
            const currentTimeStr = now.toTimeString().substring(0, 5);
            const currentDay = examData.find(d => d.date === selectedDate);
            const grade = document.getElementById('gradeSelect').value;

            const statusTag = document.getElementById('statusTag');
            const statusDetail = document.getElementById('statusDetail');

            document.querySelectorAll('.period-table tbody tr').forEach(r => r.classList.remove('status-active', 'status-prep'));

            let foundActive = false;

            if (currentDay) {
                for (let p of currentDay.periods) {
                    const subject = p.subjects[grade] || '해당 없음';
                    if (currentTimeStr >= p.startTime && currentTimeStr < p.prepEndTime) {
                        highlightRow(currentDay.date, p.period, "status-prep");
                        statusTag.innerText = "준비 시간";
                        statusTag.style.color = "#b45309";
                        statusTag.style.borderColor = "#fcd34d";
                        statusDetail.innerText = `${p.period} 준비 중 (${subject})`;
                        foundActive = true;
                        break;
                    } 
                    else if (currentTimeStr >= p.prepEndTime && currentTimeStr < p.endTime) {
                        highlightRow(currentDay.date, p.period, "status-active");
                        statusTag.innerText = "시험 진행 중";
                        statusTag.style.color = "#15803d";
                        statusTag.style.borderColor = "#86efac";
                        statusDetail.innerText = `${p.period} 본시험 (${subject})`;
                        foundActive = true;
                        break;
                    }
                }
            }

            if (!foundActive) {
                statusTag.innerText = "시험 대기";
                statusTag.style.color = "#64748b";
                statusTag.style.borderColor = "#cbd5e1";
                statusDetail.innerText = "현재 진행 중인 시험 일정이 없습니다.";
            }
        }

        function highlightRow(date, period, className) {
            const row = document.getElementById(`row-${date}-${period}`);
            if (row) row.classList.add(className);
        }

        function startPreciseClock() {
            updateClock();
            const now = new Date();
            const delay = 1000 - now.getMilliseconds();
            setTimeout(() => {
                updateClock();
                setInterval(updateClock, 1000);
            }, delay);
        }

        initDateSelect();
        renderSchedule();
        startPreciseClock();
    </script>
</body>
</html>
